name: spot_my_car
description: "SpotMyCar - repère, collectionne et partage les voitures croisées dans la rue."
publish_to: 'none'

version: 2.0.0+20

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: any
  firebase_auth: any
  cloud_firestore: any
  firebase_storage: any
  firebase_app_check: any
  cloud_functions: any
  firebase_ai: any
  google_sign_in: ^6.2.1

  # Interface
  google_fonts: any
  flutter_animate: any
  confetti: any
  cached_network_image: any
  flutter_cache_manager: any
  flutter_typeahead: any
  flutter_map: any
  latlong2: any
  flutter_map_marker_cluster: any
  provider: any
  intl: any

  # Utilitaires
  http: any
  image_picker: any
  connectivity_plus: any
  shared_preferences: any
  package_info_plus: any
  path_provider: any
  url_launcher: any
  audioplayers: any
  share_plus: any
  geolocator: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any
  flutter_launcher_icons: any

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/google_logo.png
    - assets/data/brands.json
    - assets/data/models_by_brand/
    - assets/data/world_cities.json
    - assets/avatars/
    - assets/audio/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
