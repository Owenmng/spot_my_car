name: spot_my_car
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase & Google (Versions récentes et compatibles)
  firebase_core: ^2.32.0
  firebase_auth: ^4.20.0
  cloud_firestore: ^4.17.5
  firebase_storage: ^11.7.7
  google_sign_in: ^6.2.1
  firebase_app_check: ^0.2.2+1
  cloud_functions: ^4.6.1

  # Machine Learning
  google_mlkit_image_labeling: ^0.12.0
  
  # UI & Widgets
  cupertino_icons: ^1.0.6
  intl: ^0.20.2
  mask_text_input_formatter: ^2.9.0
  url_launcher: ^6.3.1
  font_awesome_flutter: ^10.8.0
  confetti: ^0.8.0
  flutter_typeahead: ^5.2.0
  diacritic: ^0.1.6
  flutter_map: ^7.0.0
  latlong2: ^0.9.1
  flutter_map_marker_cluster: ^1.4.0
  # On laisse Flutter choisir la meilleure version de cached_network_image
  cached_network_image:
  provider: ^6.1.5
  
  # Utilitaires
  http: ^1.4.0
  image_picker: ^1.1.2
  connectivity_plus: ^6.1.4
  shared_preferences: ^2.5.3
  package_info_plus: ^8.3.0
  # On laisse flutter_cache_manager choisir aussi
  flutter_cache_manager:
  path_provider: ^2.1.5
  audioplayers: ^6.5.0
  
  # Génération d'icônes
  flutter_launcher_icons: ^0.13.1
  change_app_package_name: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  http: ^1.2.1
  path: ^1.9.0


# On force tout le monde à utiliser la dernière version du package web
# pour résoudre le conflit entre Firebase et cached_network_image.
dependency_overrides:
  web: ^1.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/google_logo.png
    - assets/data/brands.json
    - assets/data/models_by_brand/
    - assets/data/world_cities.json
    - assets/avatars/
    - assets/audio/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"