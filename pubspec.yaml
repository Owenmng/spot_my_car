name: spot_my_car
description: "SpotMyCar - repère, collectionne et partage les voitures croisées dans la rue."
publish_to: 'none'

version: 2.0.0+20

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: any
  firebase_auth: any
  cloud_firestore: any
  firebase_storage: any
  firebase_app_check: any
  cloud_functions: any
  firebase_ai: any
  google_sign_in: ^6.2.1

  # Interface
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  confetti: ^0.8.0
  cached_network_image: any
  flutter_cache_manager: any
  flutter_typeahead: ^5.2.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  flutter_map_marker_cluster: ^1.4.0
  provider: ^6.1.2
  intl: any

  # Utilitaires
  http: any
  image_picker: any
  connectivity_plus: any
  shared_preferences: any
  package_info_plus: any
  path_provider: any
  url_launcher: any
  audioplayers: any
  share_plus: any
  geolocator: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any
  flutter_launcher_icons: any

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/google_logo.png
    - assets/data/brands.json
    - assets/data/models_by_brand/
    - assets/data/world_cities.json
    - assets/avatars/
    - assets/audio/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
