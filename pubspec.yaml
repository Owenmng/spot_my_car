name: spot_my_car
description: "SpotMyCar - repère, collectionne et partage les voitures croisées dans la rue."
publish_to: 'none'

version: 1.1.0+26

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  firebase_storage: ^14.0.1
  firebase_app_check: ^0.5.1
  cloud_functions: ^7.0.1
  firebase_ai: ^5.1.0
  google_sign_in: ^6.2.1

  # Interface
  google_fonts: ^6.3.3
  flutter_animate: ^4.5.2
  cached_network_image: ^4.0.6
  flutter_cache_manager: ^3.5.0
  flutter_typeahead: ^5.2.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  flutter_map_marker_cluster: ^1.4.0
  provider: ^6.1.2
  intl: any

  # Utilitaires
  http: ^1.6.0
  flutter_local_notifications: 22.3.1
  timezone: '>=0.10.0 <1.0.0'
  image_picker: ^1.2.4
  connectivity_plus: ^7.3.2
  shared_preferences: ^2.5.6
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  url_launcher: ^6.3.3
  audioplayers: ^6.8.1
  share_plus: ^13.3.1
  geolocator: ^14.0.1
  image: ^4.5.4
  in_app_review: ^2.0.10
  in_app_purchase: ^3.2.3
  firebase_messaging: ^17.0.1
  google_mobile_ads: ^9.0.0

# Uniquement pour Linux : aligne dbus entre notifications et connectivity_plus.
dependency_overrides:
  dbus: ^0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any
  flutter_launcher_icons: any

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/google_logo.png
    - assets/data/brands.json
    - assets/data/models_by_brand/
    - assets/data/world_cities.json
    - assets/avatars/
    - assets/audio/
    - assets/i18n/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
