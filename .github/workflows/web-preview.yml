name: Web preview (captures)

on:
  push:
    branches: ['wip/v1-1']
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --no-tree-shake-icons
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/web
          retention-days: 3
      - name: Captures
        run: |
          npm i --no-save playwright@1.49.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          (cd build/web && python3 -m http.server 8088 >/dev/null 2>&1 &)
          sleep 2
          mkdir -p shots
          node tool/shots_v11.js http://localhost:8088 shots
      - name: Publier les captures
        run: |
          cd shots
          git init -q -b captures-v11
          git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          git add . && git commit -qm "captures ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" captures-v11
