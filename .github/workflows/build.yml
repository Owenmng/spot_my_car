name: Build APK

on:
  push:
    branches: [refonte, main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Versions
        run: flutter --version

      - name: Dependencies
        run: |
          flutter pub get
          echo "=== RESOLVED ==="
          grep -B0 -A0 -E '^  [a-z_0-9]+:$|^    version:' pubspec.lock | paste - - | sed 's/ *version: */ /' | tr -s ' ' | grep -E 'firebase|cloud_|google_|flutter_animate|share_plus|geolocator|image_picker|cached|flutter_map|typeahead|provider|audioplayers|connectivity|url_launcher|package_info|confetti|intl|http |shared_pref'
          echo "=== END RESOLVED ==="

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.txt

      - name: Build APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.txt

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: spotmycar-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            analyze.txt
            build.txt
