name: Build APK

on:
  push:
    branches: [refonte, main, 'wip/v1-1']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Versions
        run: flutter --version

      - name: Dependencies
        run: |
          flutter pub get
          echo "=== RESOLVED ==="
          flutter pub deps --style=compact --no-dev | grep -E "^- " || true
          echo "=== END RESOLVED ==="

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.txt

      - name: Clé d'envoi Play Store
        env:
          UPLOAD_KEY_PASS: ${{ secrets.UPLOAD_KEY_PASS }}
        run: |
          if [ -n "$UPLOAD_KEY_PASS" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in android/app/upload-key.p12.enc -out android/app/upload-key.p12 -pass env:UPLOAD_KEY_PASS
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=upload\nstoreFile=app/upload-key.p12\n' "$UPLOAD_KEY_PASS" "$UPLOAD_KEY_PASS" > android/key.properties
            echo "AAB signé avec la clé d'envoi"
          else
            echo "Pas de clé d'envoi : signature de test"
          fi

      - name: Build APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.txt
          flutter build appbundle --release 2>&1 | tee -a build.txt

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: spotmycar-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Publish test release
        if: success() && github.ref == 'refs/heads/refonte'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk SpotMyCar-test.apk
          cp build/app/outputs/bundle/release/app-release.aab SpotMyCar-PlayStore.aab
          gh release delete test-latest --yes --cleanup-tag || true
          gh release create test-latest SpotMyCar-test.apk SpotMyCar-PlayStore.aab --prerelease --target ${{ github.sha }} \
            --title "Version de test (${GITHUB_SHA::7})" \
            --notes "APK de test compilé automatiquement depuis la branche refonte."

      - name: Publish preview release (v1.1)
        if: success() && github.ref == 'refs/heads/wip/v1-1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk SpotMyCar-1.1-apercu.apk
          gh release delete apercu-1.1 --yes --cleanup-tag || true
          gh release create apercu-1.1 SpotMyCar-1.1-apercu.apk --prerelease --target ${{ github.sha }} \
            --title "Aperçu 1.1 (${GITHUB_SHA::7})" \
            --notes "Version 1.1 en préparation (branche wip/v1-1). Non publiée sur le Play Store."

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            analyze.txt
            build.txt
