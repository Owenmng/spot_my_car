name: Build APK

on:
  push:
    branches: [refonte, main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Versions
        run: flutter --version

      - name: Dependencies
        run: |
          flutter pub get
          echo "=== RESOLVED ==="
          flutter pub deps --style=compact --no-dev | grep -E "^- " || true
          echo "=== END RESOLVED ==="

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.txt

      - name: Build APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.txt

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: spotmycar-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Publish test release
        if: success() && github.ref == 'refs/heads/refonte'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk SpotMyCar-test.apk
          gh release delete test-latest --yes --cleanup-tag || true
          gh release create test-latest SpotMyCar-test.apk --prerelease --target ${{ github.sha }} \
            --title "Version de test (${GITHUB_SHA::7})" \
            --notes "APK de test compilé automatiquement depuis la branche refonte."

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            analyze.txt
            build.txt
