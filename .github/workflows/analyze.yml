name: Analyze (wip)

on:
  push:
    branches: ['wip/**']

concurrency:
  group: analyze-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Flutter 3.50 exige Gradle 9.3 : on reste sur la version qui compile le projet.
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1 || true
          grep -E "error •" analyze.txt | head -150 || true
          echo "ERRORS=$(grep -c 'error •' analyze.txt)"
